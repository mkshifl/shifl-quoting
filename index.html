<style>
  html,body{height:100%;margin:0}
  .tabular{font-variant-numeric:tabular-nums}
  .phone-scroll{scrollbar-width:none}
  .phone-scroll::-webkit-scrollbar{display:none}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
  @keyframes pulse{50%{opacity:.4}}
  .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
  .nav-group{overflow:hidden;transition:max-height .28s cubic-bezier(.4,0,.2,1)}
  .nav-chev{transition:transform .2s ease}
  .nav-link{transition:background-color .15s ease,color .15s ease}

<style id="wz-theme">
:root{
  --font-ui:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-display:'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f5f8fc; --surface-3:#eaf0f8;
  --border:#e4e9f2; --border-2:#d4dced;
  --text:#0e1a30; --text-2:#37455f; --muted:#5f6f8a; --faint:#93a0b6;
  --side-1:#0c2246; --side-2:#0a1a37; --side-text:#aebbd4; --side-active:#ffffff;
  --brand:#12335f; --brand-2:#3f6ea5; --accent:#2f7fe0; --accent-2:#38bdf8;
  --grid:rgba(15,26,48,.035);
  --shadow-sm:0 1px 2px rgba(14,26,48,.05),0 1px 3px rgba(14,26,48,.04);
  --shadow-card:0 6px 18px -6px rgba(14,26,48,.10),0 2px 6px -2px rgba(14,26,48,.06);
  --shadow-lg:0 14px 36px -10px rgba(14,26,48,.20);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070d1a; --surface:#101c33; --surface-2:#0c1526; --surface-3:#172642;
  --border:#1b2b49; --border-2:#274063;
  --text:#e9eff9; --text-2:#c3d0e4; --muted:#93a4c2; --faint:#5f7290;
  --side-1:#0a1830; --side-2:#060d1c; --side-text:#b4c2db; --side-active:#ffffff;
  --accent:#38bdf8; --accent-2:#7dd3fc;
  --grid:rgba(120,150,200,.05);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-card:0 10px 26px -8px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.4);
  --shadow-lg:0 20px 48px -12px rgba(0,0,0,.7);
}
html,body{background:var(--bg)!important}
body{color:var(--text)!important;font-family:var(--font-ui)!important;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;}
/* neutral token remap */
.bg-white{background:var(--surface)!important}
.bg-slate-50{background:var(--surface-2)!important}
.bg-slate-100{background:var(--surface-3)!important}
.text-slate-900,.text-slate-800{color:var(--text)!important}
.text-slate-700{color:var(--text-2)!important}
.text-slate-600,.text-slate-500{color:var(--muted)!important}
.text-slate-400,.text-slate-300{color:var(--faint)!important}
.border-slate-100,.border-slate-200{border-color:var(--border)!important}
.border-slate-300{border-color:var(--border-2)!important}
.ring-slate-200{--tw-ring-color:var(--border)!important}
.divide-slate-100>:not([hidden])~:not([hidden]){border-color:var(--border)!important}
.hover\:bg-slate-50:hover,.hover\:bg-slate-100:hover{background:var(--surface-3)!important}
.bg-white.border-slate-200{box-shadow:var(--shadow-sm)}
/* display type for big figures / headings */
.text-3xl,.text-2xl,.text-xl{font-family:var(--font-display);letter-spacing:-.02em}
.tabular{font-variant-numeric:tabular-nums}
/* refined scrollbars */
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
/* ===== Sidebar (brand rail) ===== */
.wz-side{background:linear-gradient(180deg,var(--side-1),var(--side-2));color:var(--side-text);position:relative}
.wz-side::after{content:"";position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,rgba(120,160,220,.18),transparent)}
.wz-logoplate{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.6)}
.wz-logoplate img{width:100%;display:block}
.wz-road{height:6px;margin:12px 4px 2px;border-radius:6px;
  background:repeating-linear-gradient(90deg,var(--accent-2) 0 14px,transparent 14px 26px);opacity:.5}
.wz-side .nav-link{color:var(--side-text)!important;border-radius:10px}
.wz-side .nav-link:hover{color:#fff!important;background:rgba(255,255,255,.06)!important}
.wz-side .nav-link.wz-on{color:#fff!important;background:rgba(56,189,248,.14)!important;box-shadow:inset 0 0 0 1px rgba(56,189,248,.25)}
.wz-side .wz-sec{color:#7f92b4!important}
.wz-side .wz-sec:hover{color:#c7d3e8!important}
/* ===== Cards / KPIs / tables ===== */
.wz-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-card);overflow:hidden}
.wz-card-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;color:var(--text);font-family:var(--font-display);letter-spacing:-.01em}
.wz-kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow-card);transition:transform .16s ease,box-shadow .16s ease}
.wz-kpi:hover{box-shadow:var(--shadow-lg)}
.wz-kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.wz-kpi-val{font-family:var(--font-display);font-size:26px;line-height:1.1;font-weight:600;color:var(--text);margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wz-kpi-sub{font-size:11px;color:var(--faint);margin-top:3px}
.wz-tbl{border-collapse:collapse}
.wz-tbl thead th{background:var(--surface-2);text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--border)}
.wz-tbl tbody tr{transition:background .12s ease}
.wz-tbl tbody tr:hover{background:var(--surface-2)}
.wz-btn-brand{background:linear-gradient(135deg,var(--brand-2),var(--accent));color:#fff;box-shadow:0 6px 16px -6px rgba(47,127,224,.6)}
.wz-btn-brand:hover{filter:brightness(1.06)}
.wz-icon-btn{color:var(--muted)}
.wz-icon-btn:hover{background:var(--surface-3);color:var(--text)}
/* ===== dark-mode accent pill remaps ===== */
[data-theme="dark"] .bg-sky-50{background:rgba(56,189,248,.14)!important}
[data-theme="dark"] .bg-sky-100{background:rgba(56,189,248,.2)!important}
[data-theme="dark"] .text-sky-600,[data-theme="dark"] .text-sky-700{color:#7dd3fc!important}
[data-theme="dark"] .ring-sky-200{--tw-ring-color:rgba(56,189,248,.35)!important}
[data-theme="dark"] .bg-emerald-50{background:rgba(16,185,129,.14)!important}
[data-theme="dark"] .bg-emerald-100{background:rgba(16,185,129,.2)!important}
[data-theme="dark"] .text-emerald-600,[data-theme="dark"] .text-emerald-700{color:#6ee7b7!important}
[data-theme="dark"] .ring-emerald-200{--tw-ring-color:rgba(16,185,129,.35)!important}
[data-theme="dark"] .bg-amber-50{background:rgba(245,158,11,.14)!important}
[data-theme="dark"] .bg-amber-100{background:rgba(245,158,11,.2)!important}
[data-theme="dark"] .text-amber-600,[data-theme="dark"] .text-amber-700,[data-theme="dark"] .text-amber-800{color:#fcd34d!important}
[data-theme="dark"] .ring-amber-200{--tw-ring-color:rgba(245,158,11,.35)!important}
[data-theme="dark"] .bg-red-50{background:rgba(239,68,68,.14)!important}
[data-theme="dark"] .text-red-600,[data-theme="dark"] .text-red-700{color:#fca5a5!important}
[data-theme="dark"] .ring-red-200{--tw-ring-color:rgba(239,68,68,.35)!important}
[data-theme="dark"] .border-red-200{border-color:rgba(239,68,68,.35)!important}
[data-theme="dark"] .bg-red-50{background:rgba(239,68,68,.12)!important}
[data-theme="dark"] .bg-indigo-50{background:rgba(99,102,241,.16)!important}
[data-theme="dark"] .bg-indigo-100{background:rgba(99,102,241,.22)!important}
[data-theme="dark"] .text-indigo-600,[data-theme="dark"] .text-indigo-700{color:#a5b4fc!important}
[data-theme="dark"] .ring-indigo-200{--tw-ring-color:rgba(99,102,241,.35)!important}
[data-theme="dark"] .border-indigo-200{border-color:rgba(99,102,241,.4)!important}
[data-theme="dark"] .bg-violet-50{background:rgba(139,92,246,.16)!important}
[data-theme="dark"] .text-violet-600,[data-theme="dark"] .text-violet-700{color:#c4b5fd!important}
[data-theme="dark"] .bg-cyan-50{background:rgba(34,211,238,.16)!important}
[data-theme="dark"] .text-cyan-600,[data-theme="dark"] .text-cyan-700{color:#67e8f9!important}
[data-theme="dark"] .bg-rose-50{background:rgba(244,63,94,.16)!important}
[data-theme="dark"] .text-rose-600,[data-theme="dark"] .text-rose-700{color:#fda4af!important}
[data-theme="dark"] .bg-sky-500,[data-theme="dark"] .bg-emerald-500,[data-theme="dark"] .bg-indigo-500{filter:saturate(1.05)}
/* ===== Drayage horizontal sub-nav ===== */
.wz-subnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:2px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;box-shadow:0 1px 0 var(--border)}
.wz-subnav::-webkit-scrollbar{height:0}
.wz-subtab{position:relative;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:15px 15px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;transition:color .15s ease}
.wz-subtab:hover{color:var(--text)}
.wz-subtab-on{color:var(--text);border-bottom-color:var(--accent)}
.wz-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;line-height:1.6}
.wz-badge-green{background:rgba(16,185,129,.15);color:#0f9d6b}
.wz-badge-amber{background:rgba(245,158,11,.18);color:#c2740a}
[data-theme="dark"] .wz-badge-green{color:#6ee7b7}
[data-theme="dark"] .wz-badge-amber{color:#fcd34d}
.plan-card{touch-action:none;user-select:none}
.wz-dragclone{border-radius:8px}
[data-drop].wz-drop-on{box-shadow:inset 0 0 0 2px var(--accent);background:rgba(56,189,248,.09);border-radius:10px}
.wz-toast{display:flex;align-items:center;gap:8px;background:var(--text);color:var(--surface);font-size:13px;font-weight:500;padding:10px 14px;border-radius:10px;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);opacity:0;transform:translateY(10px);transition:opacity .2s ease,transform .2s ease}
.wz-toast.wz-toast-in{opacity:1;transform:translateY(0)}
.wz-toast-dot{width:8px;height:8px;border-radius:50%;background:#34d399;flex-shrink:0}
/* ===== smooth + cool polish ===== */
#content>div{animation:wzFadeUp .34s cubic-bezier(.22,.61,.36,1) both}
@keyframes wzFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wz-card{transition:box-shadow .2s ease,transform .15s ease}
.wz-card:hover{box-shadow:var(--shadow-lg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background:radial-gradient(55vw 40vw at 10% -8%,rgba(56,189,248,.10),transparent 60%),radial-gradient(50vw 42vw at 102% -2%,rgba(99,102,241,.10),transparent 55%);
  animation:wzAurora 20s ease-in-out infinite alternate}
[data-theme="dark"] body::after{opacity:.8}
@keyframes wzAurora{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,2%,0) scale(1.06)}}
.wz-logoplate{position:relative;overflow:hidden}
.wz-logoplate::after{content:"";position:absolute;top:0;left:-45%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(56,189,248,.35),transparent);animation:wzScan 6s ease-in-out infinite}
@keyframes wzScan{0%,55%{left:-45%}78%,100%{left:130%}}
.wz-side .nav-link.wz-on{box-shadow:inset 0 0 0 1px rgba(56,189,248,.25),0 0 22px -8px rgba(56,189,248,.55)}
.nav-link{transition:transform .12s ease,background .15s ease,color .15s ease}
.wz-side .nav-link:active{transform:scale(.98)}
.wz-live{position:relative;display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399}
.wz-live::after{content:"";position:absolute;inset:0;border-radius:50%;background:#34d399;animation:wzPing 1.6s cubic-bezier(0,0,.2,1) infinite}
.wz-off{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b}
@keyframes wzPing{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}
.wz-clock{font-variant-numeric:tabular-nums;font-family:var(--font-display)}
button{transition:transform .08s ease}
button:active{transform:scale(.97)}
.wz-btn-brand{transition:filter .15s ease,transform .08s ease,box-shadow .2s ease}
.wz-btn-brand:hover{box-shadow:0 8px 22px -6px rgba(47,127,224,.7)}
.wz-toast{position:relative;overflow:hidden}
.wz-toast::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:rgba(52,211,153,.9);transform-origin:left;animation:wzToastBar 2.6s linear forwards}
@keyframes wzToastBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.wz-confetti{position:fixed;top:-12px;z-index:10001;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:wzFall linear forwards}
@keyframes wzFall{to{transform:translateY(106vh) rotate(720deg);opacity:.85}}
</style>

// Regenerate legs from routing — enforces empty return to port unless 1 Way
function buildLegs(l,r){
  const T=l.terminal, yard="Wayz yard — Newark";
  const city=l.consignee.includes("—")?l.consignee.split("—")[1].trim():l.consignee;
  const P=(name,loc,status,eta)=>({name,loc,status:status||"pending",eta:eta||"Planned"});
  if(l.type==="EXP") return [P("Pull empty",T,"ready"),P("Load at shipper",city),P("Return full to terminal",T)];
  if(r==="1 Way") return [P("Pull from terminal",T,"ready"),P("Deliver to consignee",city)];
  if(r==="Live") return [P("Pull from terminal",T,"ready"),P("Live delivery",city),P("Return empty",T)];
  if(r==="Drop and Hook") return [P("Pull from terminal",T,"ready"),P("Drop loaded at consignee",city),P("Pick up empty",city),P("Return empty",T)];
  if(r==="Prepull-Live") return [P("Pull from terminal",T,"ready"),P("Yard storage",yard),P("Live delivery",city),P("Return empty",T)];
  if(r==="Prepull drop") return [P("Pull from terminal",T,"ready"),P("Yard storage",yard),P("Drop at consignee",city),P("Return empty",T)];
  return l.legs;
}
function setRouting(id,r){const l=LOADS.find(x=>x.id===id);l.routing=r;l.legs=buildLegs(l,r);openLoad(id);}
window.setRouting=setRouting;

function pill(s){const m=STATUS[s]||STATUS.available;return `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ${m.pill}"><span class="h-1.5 w-1.5 rounded-full ${m.dot}"></span>${m.label}</span>`;}
function typeBadge(t){return `<span class="rounded px-1.5 py-0.5 text-[10px] font-semibold ring-1 ${TYPE[t]}">${t}</span>`;}
function lfdMeta(lfd){
  if(!lfd||lfd==="—")return{txt:"—",cls:"text-slate-400"};
  const today=new Date("2026-09-14"),d=new Date(lfd);
  const days=Math.round((d-today)/86400000);
  const txt=d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  if(days<0)return{txt:txt+" · overdue",cls:"text-red-600 font-semibold"};
  if(days<=1)return{txt:txt+" · "+(days===0?"today":"1d"),cls:"text-amber-600 font-semibold"};
  return{txt,cls:"text-slate-600"};
}
function isExport(l){return String((l&&l.type)||"").toUpperCase()==="EXP";}
function loadLRD(l){var m=l&&l.meta&&l.meta.dates;return (m&&m.lrd)||(l&&l.lrd)||"";}
function loadERD(l){var m=l&&l.meta&&l.meta.dates;return (m&&m.erd)||(l&&l.erd)||"";}
function loadBooking(l){return (l&&l.meta&&l.meta.booking)||(l&&l.booking)||"";}
function urgencyMeta(l){if(isExport(l)){var u=lfdMeta(loadLRD(l)||"\u2014");u.label="LRD";return u;}var v=lfdMeta((l&&l.lfd)||"\u2014");v.label="LFD";return v;}

/* ================= LINXUP INTEGRATION (GPS + HOS) =================
   No key lives here. Point LINXUP.base at your backend proxy, which holds
   the Linxup API key server-side and exposes:
     GET {base}/positions -> [{id,vehicle,driver,lat,lng,speedMph,heading,lastReport,address}]
     GET {base}/hos       -> [{driver,hoursLeft,status,note,flag}]   flag: ok | warn | violation
   Until the proxy responds, the UI shows demo data and a "not connected" chip. */
const LINXUP={base:"",pollMs:30000,timer:null};
function linxupState(){
  if(!state.linxup) state.linxup={live:false,lastSync:null,error:null,
    positions:[
      {id:"T-114",vehicle:"T-114",driver:"R. Alvarez",lat:40.6895,lng:-74.1745,speedMph:0,heading:0,lastReport:"demo",address:"APM Elizabeth — gate"},
      {id:"T-118",vehicle:"T-118",driver:"M. Osei",lat:40.6820,lng:-74.1510,speedMph:34,heading:90,lastReport:"demo",address:"Corbin St, Newark"},
      {id:"T-121",vehicle:"T-121",driver:"D. Whitfield",lat:40.7357,lng:-74.1724,speedMph:52,heading:270,lastReport:"demo",address:"I-78 W, Newark"}
    ],
    hos:[
      {driver:"M. Osei",hoursLeft:1.2,status:"On duty — driving",note:"Approaching 11h limit",flag:"warn"},
      {driver:"R. Alvarez",hoursLeft:4.5,status:"On duty — driving",note:"OK",flag:"ok"},
      {driver:"S. Petrov",hoursLeft:0,status:"Off duty",note:"10h reset in progress",flag:"ok"},
      {driver:"D. Whitfield",hoursLeft:8.0,status:"On duty — driving",note:"OK",flag:"ok"}
    ]};
  return state.linxup;
}
async function linxupGet(path){if(!LINXUP.base)throw new Error("no proxy URL set");const r=await fetch(LINXUP.base.replace(/\/$/,"")+path,{headers:{Accept:"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
async function linxupRefresh(){const s=linxupState();if(!LINXUP.base){s.live=false;s.error=null;return;}
  try{const [pos,hos]=await Promise.all([linxupGet("/positions"),linxupGet("/hos")]);
    if(Array.isArray(pos)&&pos.length)s.positions=pos;
    if(Array.isArray(hos)&&hos.length)s.hos=hos;
    s.live=true;s.error=null;s.lastSync=new Date().toLocaleTimeString();
  }catch(e){s.live=false;s.error=e.message;}
  if(["hosalerts","geofence","dispatch","integrations"].includes(state.active))render();
}
function linxupConnect(url){LINXUP.base=(url||"").trim();const s=linxupState();if(LINXUP.timer)clearInterval(LINXUP.timer);
  if(LINXUP.base){linxupRefresh();LINXUP.timer=setInterval(linxupRefresh,LINXUP.pollMs);}else{s.live=false;s.error=null;}
  render();}
function linxupDisconnect(){LINXUP.base="";if(LINXUP.timer)clearInterval(LINXUP.timer);const s=linxupState();s.live=false;s.error=null;render();}
window.linxupConnect=linxupConnect;window.linxupDisconnect=linxupDisconnect;
function linxupStatusChip(){const s=linxupState();return s.live
  ?`<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-medium text-emerald-700 ring-1 ring-emerald-200"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Live · Linxup${s.lastSync?" · "+s.lastSync:""}</span>`
  :`<span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-2.5 py-1 text-[11px] font-medium text-amber-700 ring-1 ring-amber-200"><span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>Demo data · connect Linxup</span>`;}
function linxupPanel(){const s=linxupState();return `<div class="p-6 pb-0"><div class="wz-card"><div class="wz-card-head flex items-center justify-between"><span>Linxup — GPS &amp; HOS</span>${linxupStatusChip()}</div>
  <div class="p-4">
    <p class="mb-3 text-sm text-slate-500">Point this at your Linxup proxy URL. Your API key stays on the backend — never entered here. The proxy exposes <code class="rounded bg-slate-100 px-1 text-[11px]">/positions</code> and <code class="rounded bg-slate-100 px-1 text-[11px]">/hos</code>.</p>
    <div class="flex flex-wrap items-center gap-2">
      <input id="linxupUrl" value="${LINXUP.base}" placeholder="https://your-proxy.example.com" class="min-w-[260px] flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:border-sky-400 focus:bg-white"/>
      <button onclick="linxupConnect(document.getElementById('linxupUrl').value)" class="wz-btn-brand rounded-lg px-3.5 py-2 text-sm font-semibold">Connect</button>
      ${LINXUP.base?`<button onclick="linxupDisconnect()" class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Disconnect</button>`:''}
    </div>
    ${s.error?`<div class="mt-2 text-xs text-amber-600">Last attempt failed (${s.error}) — showing demo data until the proxy responds.</div>`:''}
    <div class="mt-3 text-[11px] text-slate-400">Polls every ${LINXUP.pollMs/1000}s. Positions feed the dispatch board &amp; geofence; HOS feeds HOS Alerts.</div>
  </div></div></div>`;}
window.linxupRefresh=linxupRefresh;

function setActive(k){state.active=k;state.navOpen=state.navOpen||{};const sec=NAV.find(s=>s.items.some(i=>i.key===k));if(sec)state.navOpen[sec.section]=true;render();}

/* ================= ROLES & PERMISSIONS ================= */
const ROLE_ACCESS={
  admin:["*"],
  dispatcher:["Operations","Assets","Drivers","Tracking","OTR","AI"],
  billing:["AR","AP","Wayz Books","CustomerService","Insights"],
  sales:["Sales","CustomerService","Insights"],
  ops_manager:["Operations","Assets","Drivers","Tracking","OTR","Insights","AI","CustomerService"]
};
const ROLE_LABELS={admin:"Admin (all)",dispatcher:"Dispatcher",billing:"Billing / AR-AP",sales:"Sales",ops_manager:"Ops Manager"};
function curRole(){if(!state.role){try{state.role=localStorage.getItem("wz_role")||"admin";}catch(e){state.role="admin";}}return state.role;}
function roleCan(section){var a=ROLE_ACCESS[curRole()]||["*"];return a.indexOf("*")>=0||a.indexOf(section)>=0;}
function allowedHubs(){return SECTION_HUBS.filter(function(h){return roleCan(h.section);});}
function setRole(r){state.role=r;try{localStorage.setItem("wz_role",r);}catch(e){}var hubs=allowedHubs();var okSection=(NAV.find(function(s){return s.items.some(function(i){return i.key===state.active;});})||{}).section;if(!roleCan(okSection)&&hubs.length){setActive(hubs[0].land);return;}render();}
window.setRole=setRole;

/* ---------------- NAV ---------------- */
function renderNav(){
  document.getElementById("nav").innerHTML=allowedHubs().map(h=>{
    const on=(NAV.find(s=>s.section===h.section)||{items:[]}).items.some(i=>i.key===state.active);
    return `<button onclick="setActive('${h.land}')" class="nav-link relative flex w-full items-center gap-3 py-2.5 pl-3 pr-2 text-sm ${on?'wz-on':''}">${on?'<span class="absolute left-0 top-1/2 h-5 w-1 -translate-y-1/2 rounded-r bg-sky-400"></span>':''}<i data-lucide="${h.icon}" class="h-[18px] w-[18px] ${on?'text-sky-400':'text-slate-400'}"></i><span class="flex-1 text-left">${h.label}</span></button>`;
  }).join("");
}
function toggleNav(sec){
  state.navOpen[sec]=!state.navOpen[sec];
  const g=document.querySelector('.nav-group[data-sec="'+sec+'"]');
  const chev=document.querySelector('.nav-chev[data-sec="'+sec+'"]');
  if(g)g.style.maxHeight=state.navOpen[sec]?g.scrollHeight+'px':'0';
  if(chev)chev.style.transform='rotate('+(state.navOpen[sec]?90:0)+'deg)';
}
window.toggleNav=toggleNav;

/* ---------------- MODULES ---------------- */
function cityOf(l){var c=l.consignee||"";return c.split(",")[0]||c;}
function isPortName(t){return ["apm","pnct","port liberty bayonne","gct ny","maher","red hook"].indexOf(String(t||"").toLowerCase())>=0;}
function evCell(label,loc){return loc?('<div class="text-[9px] font-semibold uppercase tracking-wide text-slate-400">'+label+'</div><div class="text-xs text-slate-700">'+loc+'</div>'):'<span class="text-slate-300">\u2014</span>';}
function statusCell(l){
  var p=[];
  if(l.status==="delivered"||l.status==="completed")p.push('<span class="rounded bg-emerald-50 px-1.5 py-0.5 text-[10px] font-medium text-emerald-700">Delivered</span>');
  else if(l.driver)p.push('<span class="rounded bg-sky-50 px-1.5 py-0.5 text-[10px] font-medium text-sky-700">Dispatched</span>');
  else p.push('<span class="text-[11px] font-medium text-amber-600">Pending</span>');
  (l.holds||[]).forEach(function(h){var rel=/released|clear/i.test(h);p.push('<span class="rounded px-1.5 py-0.5 text-[10px] font-medium '+(rel?"bg-emerald-50 text-emerald-700":"bg-amber-50 text-amber-700")+'">'+h+'</span>');});
  return '<div class="flex flex-col items-start gap-1">'+p.join("")+'</div>';
}
function driverCell(l){
  if(l.driver)return '<div><div class="text-xs font-medium text-slate-700">'+l.driver+'</div><div class="mt-1 flex gap-1"><button onclick="event.stopPropagation();driverConfirm(\''+l.id+'\')" class="flex h-5 w-5 items-center justify-center rounded bg-emerald-50 text-emerald-600 hover:bg-emerald-100"><i data-lucide="check" class="h-3 w-3"></i></button><button onclick="event.stopPropagation();driverReject(\''+l.id+'\')" class="flex h-5 w-5 items-center justify-center rounded bg-red-50 text-red-500 hover:bg-red-100"><i data-lucide="x" class="h-3 w-3"></i></button></div></div>';
  return '<button onclick="event.stopPropagation();openAssign(\''+l.id+'\')" class="flex h-7 w-7 items-center justify-center rounded-full border border-dashed border-slate-300 text-slate-400 hover:border-sky-400 hover:text-sky-600"><i data-lucide="user-plus" class="h-3.5 w-3.5"></i></button>';
}
function setDispTile(t){state.dispTile=t;state.dispTerminal=null;render();}
function setDispTerm(t){state.dispTerminal=(state.dispTerminal===t?null:t);render();}
function driverConfirm(id){toast("Dispatch confirmed");}
function driverReject(id){var l=LOADS.find(function(x){return x.id===id;});if(l){l.driver=null;l.status="available";if(WZ.sb)wzUpsertLoad(l);}toast("Driver removed");render();}
window.setDispTile=setDispTile;window.setDispTerm=setDispTerm;window.driverConfirm=driverConfirm;window.driverReject=driverReject;
function mDispatch(){
  var isAct=function(l){return l.status!=="delivered"&&l.status!=="completed";};
  var needPickup=LOADS.filter(function(l){return isAct(l)&&!l.driver;});
  var dispatched=LOADS.filter(function(l){return isAct(l)&&l.driver;});
  var onHold=LOADS.filter(function(l){return isAct(l)&&(l.holds||[]).length;});
  var atRisk=LOADS.filter(function(l){return isAct(l)&&urgencyMeta(l).cls.indexOf("red")>=0;});
  var delivered=LOADS.filter(function(l){return l.status==="delivered"||l.status==="completed";});
  var searching=!!state.search;
  var tile=state.dispTile||"pickup";
  var rows;
  if(searching){var q=state.search;rows=LOADS.filter(function(l){return [l.id,l.container,l.mbl,l.customer,l.ssl,l.terminal].join(" ").toLowerCase().includes(q);});}
  else rows=({pickup:needPickup,dispatched:dispatched,hold:onHold,risk:atRisk,delivered:delivered})[tile]||needPickup;
  var byTerm={};rows.forEach(function(l){var t=l.terminal||"";if(t){byTerm[t]=(byTerm[t]||0)+1;}});
  if(state.dispTerminal)rows=rows.filter(function(l){return (l.terminal||"")===state.dispTerminal;});
  var riskN=function(a){return a.filter(function(l){return urgencyMeta(l).cls.indexOf("red")>=0;}).length;};
  var apptN=needPickup.filter(function(l){return l.pickupAppt;}).length;
  var tc=function(key,count,label,subs,cls){var on=(!searching&&tile===key);return '<button onclick="setDispTile(\''+key+'\')" class="rounded-xl border px-4 py-3 text-left transition '+(on?"border-sky-400 bg-sky-50/50 ring-1 ring-sky-200":"border-slate-200 bg-white hover:border-slate-300")+'"><div class="text-xl font-semibold '+(cls||"text-slate-900")+'">'+count+'</div><div class="text-xs text-slate-500">'+label+'</div>'+(subs?'<div class="mt-1 text-[11px] text-slate-400">'+subs+'</div>':'')+'</button>';};
  var tiles='<div class="mb-3 grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-5">'
    +tc("pickup",needPickup.length,"Need pickup","LFD/LRD "+riskN(needPickup)+" \u00b7 Appt "+apptN)
    +tc("dispatched",dispatched.length,"Dispatched","out with a driver","text-sky-600")
    +tc("hold",onHold.length,"On hold",onHold.length?"needs release":"clear",onHold.length?"text-amber-600":"text-slate-900")
    +tc("risk",atRisk.length,"At risk","LFD/LRD red",atRisk.length?"text-red-600":"text-slate-900")
    +tc("delivered",delivered.length,"Delivered","done","text-emerald-600")
    +'</div>';
  var terms=Object.keys(byTerm).sort();
  var chips=terms.length?('<div class="mb-3 flex flex-wrap gap-1.5">'+terms.map(function(t){var on=state.dispTerminal===t;var port=isPortName(t);return '<button onclick="setDispTerm(\''+t.replace(/[\'\"]/g,"")+'\')" class="rounded-md px-2.5 py-1 text-xs font-medium '+(on?"bg-slate-800 text-white":(port?"bg-sky-50 text-sky-700 hover:bg-sky-100":"bg-slate-100 text-slate-600 hover:bg-slate-200"))+'">'+t+': '+byTerm[t]+'</button>';}).join("")+'</div>'):'';
  var head=searching?('<div class="mb-3 flex items-center justify-between rounded-lg border border-sky-200 bg-sky-50 px-3 py-2 text-sm text-sky-800"><span>Showing all loads matching \u201c'+state.search+'\u201d (includes delivered)</span><button onclick="clearSearch()" class="rounded-md border border-sky-300 bg-white px-2 py-1 text-xs font-medium text-sky-700">Clear</button></div>'):'';
  var body=rows.length?rows.map(function(l,i){var um=urgencyMeta(l);return '<tr onclick="openLoad(\''+l.id+'\')" class="cursor-pointer border-t border-slate-100 hover:bg-sky-50/40">'
    +'<td class="px-3 py-3 text-xs text-slate-400">'+(i+1)+'</td>'
    +'<td class="px-3 py-3 align-top"><div class="font-medium text-sky-700">'+l.id+(isExport(l)?' <span class="rounded bg-violet-100 px-1 text-[9px] font-semibold text-violet-700">EXP</span>':'')+'</div><div class="text-[10px] text-slate-400">'+(l.customer||"")+'</div><div class="mt-0.5 text-[10px] '+(um.cls.indexOf("red")>=0?"text-red-600 font-semibold":"text-slate-400")+'">'+um.label+" "+um.txt+'</div></td>'
    +'<td class="px-3 py-3 align-top">'+statusCell(l)+'</td>'
    +'<td class="px-3 py-3 align-top">'+driverCell(l)+'</td>'
    +'<td class="px-3 py-3 align-top">'+evCell("Pick up",l.terminal)+'</td>'
    +'<td class="px-3 py-3 align-top">'+evCell("Deliver",cityOf(l))+'</td>'
    +'<td class="px-3 py-3 align-top">'+evCell(isExport(l)?"Return":"Return",l.terminal)+'</td>'
    +'<td class="px-3 py-3 align-top font-mono text-xs text-slate-600">'+(l.container||"")+'<div class="text-[10px] text-slate-400">'+(l.size||"")+(l.ssl?(" \u00b7 "+l.ssl):"")+'</div></td>'
    +'<td class="px-3 py-3 align-top text-xs text-slate-500">'+((l.meta&&l.meta.ref)||l.ref||"\u2014")+'</td>'
    +'<td class="px-3 py-3 align-top text-xs">'+(isExport(l)?'<span class="text-violet-600">Export</span>':'<span class="text-slate-500">Import</span>')+'</td>'
    +'</tr>';}).join(""):'<tr><td colspan="10" class="px-4 py-12 text-center text-sm text-slate-400">'+(searching?"No loads match your search.":"Nothing here \u2014 pick another tile above.")+'</td></tr>';
  return '<div class="p-6">'
    +'<div class="mb-3 flex items-center justify-between"><h2 class="text-base font-semibold text-slate-800">Dispatch board</h2><button onclick="openCreateLoad()" class="wz-btn-brand flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-semibold"><i data-lucide="plus" class="h-4 w-4"></i> New load</button></div>'
    +tiles+chips+head
    +'<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white"><table class="w-full min-w-[980px] text-sm"><thead><tr class="bg-slate-50 text-left text-xs font-medium text-slate-500"><th class="px-3 py-3">#</th><th class="px-3 py-3">Load</th><th class="px-3 py-3">Status</th><th class="px-3 py-3">Driver</th><th class="px-3 py-3">Pick up</th><th class="px-3 py-3">Deliver</th><th class="px-3 py-3">Return</th><th class="px-3 py-3">Container</th><th class="px-3 py-3">Ref</th><th class="px-3 py-3">Type</th></tr></thead><tbody>'+body+'</tbody></table></div>'
    +'</div>';
}

  const um=urgencyMeta(l);

    </div>
    <div class="flex gap-1 overflow-x-auto border-b border-slate-200 px-4"><button onclick="setLoadTab('${l.id}','info')" class="whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium transition ${LT==='info'?'border-sky-500 text-slate-900':'border-transparent text-slate-500 hover:text-slate-800'}">Load Info</button><button onclick="setLoadTab('${l.id}','routing')" class="whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium transition ${LT==='routing'?'border-sky-500 text-slate-900':'border-transparent text-slate-500 hover:text-slate-800'}">Routing</button><button onclick="setLoadTab('${l.id}','billing')" class="whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium transition ${LT==='billing'?'border-sky-500 text-slate-900':'border-transparent text-slate-500 hover:text-slate-800'}">Billing</button><button onclick="setLoadTab('${l.id}','docs')" class="whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium transition ${LT==='docs'?'border-sky-500 text-slate-900':'border-transparent text-slate-500 hover:text-slate-800'}">Documents</button></div>

`:""}

function closeLoad(){const el=document.getElementById("slideover");el.className="hidden";el.innerHTML="";}
function deleteLoad(id){
  if(!confirm("Delete load "+id+"? This cannot be undone."))return;
  const i=LOADS.findIndex(x=>x.id===id);if(i>=0)LOADS.splice(i,1);
  if(WZ.sb){try{WZ.sb.from("loads").delete().eq("id",id);}catch(e){}}

}
function markDelivered(id){const l=LOADS.find(x=>x.id===id);if(!l)return;l.status="delivered";l.meta=l.meta||{};l.meta.delivered_at=new Date().toISOString();if(WZ.sb)wzUpsertLoad(l);closeLoad();toast("Load "+id+" marked delivered \u2014 Penny will draft the invoice");render();}

// Live demurrage accrual for import containers past LFD (excludes completed/export)
function accrual(l){
  if(l.type!=="IMP"||l.status==="completed"||!l.lfd||l.lfd==="—")return null;
  const daily={"20GP":210,"40GP":250,"40HC":260,"45HC":285}[l.size]||250;
  const days=Math.floor((new Date("2026-09-14")-new Date(l.lfd))/86400000);
  if(days<0)return null;
  return {base:(days+1)*daily, rate:daily/86400, daily};
}
function accrualCell(l){const a=accrual(l);if(!a)return "";return `<div class="mt-0.5 text-[10px] font-semibold text-red-500" data-ticker data-base="${a.base}" data-rate="${a.rate}">$${a.base.toFixed(2)}</div>`;}
function demExposureTicker(){let base=0,rate=0;LOADS.forEach(l=>{const a=accrual(l);if(a){base+=a.base;rate+=a.rate;}});return `<span data-ticker data-base="${base}" data-rate="${rate}">$${base.toFixed(2)}</span>`;}

// Drag & drop assignment
function dragLoad(ev,id){ev.dataTransfer.setData("text/plain",id);ev.dataTransfer.effectAllowed="move";}
function allowDrop(ev){ev.preventDefault();ev.dataTransfer.dropEffect="move";}
function dropOn(ev,driver){ev.preventDefault();const id=ev.dataTransfer.getData("text/plain");const l=LOADS.find(x=>x.id===id);if(!l)return;if(driver){l.driver=driver;if(l.status==="available")l.status="dispatched";}else{l.driver=null;if(l.status==="dispatched")l.status="available";}render();}
window.dragLoad=dragLoad;window.allowDrop=allowDrop;window.dropOn=dropOn;

/* ===== Pointer-based drag (mouse + touch) for the planner ===== */
let wzDrag=null;
function planAssign(id,driver){const l=LOADS.find(x=>x.id===id);if(!l)return;if(driver){l.driver=driver;if(l.status==="available")l.status="dispatched";l.meta=l.meta||{};l.meta.dispatchDate=state.planDate||wzToday();toast("Moved "+id+" to "+driver+" for "+fmtDay(l.meta.dispatchDate));}else{l.driver=null;if(l.status==="dispatched")l.status="available";toast(id+" moved to Unassigned");}wzUpsertLoad(l);render();}
function planClearHi(){document.querySelectorAll("[data-drop].wz-drop-on").forEach(x=>x.classList.remove("wz-drop-on"));}
function planDown(e){
  const card=e.target.closest&&e.target.closest(".plan-card");
  if(!card)return;
  if(e.target.closest("button"))return;            // let auto-assign button work
  if(!card.closest("[data-dragboard]"))return;
  wzDrag={id:card.getAttribute("data-load"),card,sx:e.clientX,sy:e.clientY,moved:false,clone:null,over:null,offX:0,offY:0};
  window.addEventListener("pointermove",planMove,{passive:false});
  window.addEventListener("pointerup",planUp,{passive:false});
  window.addEventListener("pointercancel",planUp,{passive:false});
}
function planMove(e){
  if(!wzDrag)return;
  const dx=e.clientX-wzDrag.sx,dy=e.clientY-wzDrag.sy;
  if(!wzDrag.moved){
    if(Math.hypot(dx,dy)<7)return;
    wzDrag.moved=true;
    const g=wzDrag.card.getAttribute("data-ghost");
    let c,offX,offY;
    if(g){
      c=document.createElement("div");c.textContent=g;
      c.style.cssText="position:fixed;z-index:9999;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;box-shadow:0 18px 40px -10px rgba(0,0,0,.5)";
      offX=16;offY=16;
    }else{
      const r=wzDrag.card.getBoundingClientRect();
      c=wzDrag.card.cloneNode(true);
      c.style.cssText="position:fixed;z-index:9999;pointer-events:none;width:"+r.width+"px;opacity:.96;transform:rotate(1.5deg) scale(1.02);box-shadow:0 18px 40px -10px rgba(0,0,0,.45)";
      offX=wzDrag.sx-r.left;offY=wzDrag.sy-r.top;
    }
    c.classList.add("wz-dragclone");
    document.body.appendChild(c);
    wzDrag.clone=c;wzDrag.offX=offX;wzDrag.offY=offY;
    wzDrag.card.style.opacity=".4";
    document.body.style.userSelect="none";
  }
  e.preventDefault();
  wzDrag.clone.style.left=(e.clientX-wzDrag.offX)+"px";
  wzDrag.clone.style.top=(e.clientY-wzDrag.offY)+"px";
  wzDrag.clone.style.display="none";
  const el=document.elementFromPoint(e.clientX,e.clientY);
  wzDrag.clone.style.display="";
  const col=el&&el.closest?el.closest("[data-drop]"):null;
  planClearHi();
  if(col)col.classList.add("wz-drop-on");
  wzDrag.over=col;
}
function planUp(e){
  window.removeEventListener("pointermove",planMove);
  window.removeEventListener("pointerup",planUp);
  window.removeEventListener("pointercancel",planUp);
  document.body.style.userSelect="";
  const d=wzDrag;wzDrag=null;if(!d)return;
  if(d.clone)d.clone.remove();
  if(d.card)d.card.style.opacity="";
  planClearHi();
  if(!d.moved){openLoad(d.id);return;}          // tap (no drag) = open detail
  let col=d.over;
  if(!col){const el=document.elementFromPoint(e.clientX,e.clientY);col=el&&el.closest?el.closest("[data-drop]"):null;}
  if(col)planAssign(d.id,col.getAttribute("data-driver")||"");
}
function initPlanDrag(){if(window._wzPlanDrag)return;window._wzPlanDrag=true;document.addEventListener("pointerdown",planDown);}
initPlanDrag();

/* ===== Toast ===== */
function toast(msg){
  let wrap=document.getElementById("wzToast");
  if(!wrap){wrap=document.createElement("div");wrap.id="wzToast";wrap.style.cssText="position:fixed;z-index:10000;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center";document.body.appendChild(wrap);}
  const el=document.createElement("div");el.className="wz-toast";el.innerHTML=`<span class="wz-toast-dot"></span>${msg}`;
  wrap.appendChild(el);
  const show=()=>el.classList.add("wz-toast-in");
  if(typeof requestAnimationFrame==="function")requestAnimationFrame(show);else show();
  setTimeout(()=>{el.classList.remove("wz-toast-in");setTimeout(()=>el.remove(),250);},2600);
}
window.toast=toast;

function scoreDriver(l,d){
  let s=50;const reasons=[];
  const hos=(d.hos==null?11:d.hos);
  s+=hos*4;reasons.push((""+hos).replace(/\.0$/,"")+"h HOS left");
  const jobs=(d.loads==null?0:d.loads);
  s-=jobs*8;reasons.push(jobs===0?"no active loads":jobs+" active load"+(jobs>1?"s":""));
  const st=d.status||"Available";
  if(/avail/i.test(st)){s+=20;reasons.push("available now");}
  else if(/off/i.test(st)){s-=50;reasons.push("off duty");}
  else{reasons.push(st.toLowerCase());}
  if(d.kind==="owner_op")reasons.push("owner-operator");
  if(d.chassis)reasons.push("chassis "+d.chassis);
  const bits=[];
  if(/avail/i.test(st))bits.push("available now");
  if(hos>=8)bits.push("plenty of hours ("+(""+hos).replace(/\.0$/,"")+"h)");else if(hos>0)bits.push((""+hos).replace(/\.0$/,"")+"h HOS");
  if(jobs===0)bits.push("nothing else assigned");else bits.push("lightest current load");
  const why="Recommended — "+bits.slice(0,2).join(" and ")+".";
  return {score:Math.max(1,Math.round(s)),reasons,why};
}

const ZONES=[
  {zone:"Newark / Elizabeth (0–15 mi)",base:285},{zone:"Edison / Woodbridge (15–30 mi)",base:395},
  {zone:"Central NJ (30–50 mi)",base:520},{zone:"NYC / Long Island",base:640},{zone:"Philadelphia / Lehigh (50–90 mi)",base:780},

const QUOTES=[
  {customer:"Atlantic Wholesale",lane:"APM → Edison",price:612,status:"Won"},
  {customer:"Meridian Foods",lane:"PNCT → Kearny (reefer)",price:735,status:"Sent"},
  {customer:"Northeast Retail",lane:"Maher → Carteret",price:548,status:"Lost"},
];
function computeQuote(q){const base=ZONES[q.zoneIdx].base;const sizeAdd={"20GP":0,"40HC":40,"45HC":75}[q.size]||0;const acc=(q.reefer?110:0)+(q.hazmat?120:0);const sub=base+sizeAdd+acc;const fuel=Math.round(sub*0.14);const cost=sub+fuel;const suggested=Math.round(cost*1.28/5)*5;const margin=Math.round((suggested-cost)/suggested*100);return {base,sizeAdd,acc,fuel,cost,suggested,margin};}
function setQuote(f,v){state.quote=state.quote||{zoneIdx:1,size:"40HC",reefer:false,hazmat:false};if(f==="zoneIdx")state.quote.zoneIdx=+v;else if(f==="size")state.quote.size=v;else state.quote[f]=!state.quote[f];render();}
window.setQuote=setQuote;
function mQuotes(){
  const q=state.quote=state.quote||{zoneIdx:1,size:"40HC",reefer:false,hazmat:false};
  const r=computeQuote(q);
  const opt=(v,cur,lbl)=>`<option value="${v}" ${v==cur?"selected":""}>${lbl}</option>`;
  const tgl=(f,on,lbl)=>`<button onclick="setQuote('${f}')" class="rounded-lg border px-3 py-1.5 text-xs font-medium ${on?'border-sky-400 bg-sky-50 text-sky-700':'border-slate-200 text-slate-600 hover:bg-slate-50'}">${lbl}</button>`;
  const stone={Won:"bg-emerald-50 text-emerald-700 ring-emerald-200",Sent:"bg-blue-50 text-blue-700 ring-blue-200",Lost:"bg-slate-100 text-slate-500 ring-slate-200"};
  return `<div class="p-6"><div class="grid gap-4 lg:grid-cols-5">
    <div class="rounded-xl border border-slate-200 bg-white p-5 lg:col-span-3">
      <div class="mb-4 flex items-center gap-2"><i data-lucide="badge-dollar-sign" class="h-4 w-4 text-sky-500"></i><span class="text-sm font-semibold text-slate-800">Instant quote calculator</span></div>
      <div class="space-y-4">
        <div><label class="mb-1 block text-xs font-medium text-slate-500">Destination zone</label><select onchange="setQuote('zoneIdx',this.value)" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">${ZONES.map((z,i)=>opt(i,q.zoneIdx,z.zone)).join("")}</select></div>
        <div><label class="mb-1 block text-xs font-medium text-slate-500">Container size</label><select onchange="setQuote('size',this.value)" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">${["20GP","40HC","45HC"].map(s=>opt(s,q.size,s)).join("")}</select></div>
        <div><label class="mb-1 block text-xs font-medium text-slate-500">Accessorials</label><div class="flex gap-2">${tgl("reefer",q.reefer,"Reefer / genset")}${tgl("hazmat",q.hazmat,"Hazmat")}</div></div>
      </div>
    </div>
    <div class="rounded-xl border border-sky-200 bg-white p-5 lg:col-span-2">
      <div class="text-xs font-medium uppercase tracking-wide text-slate-400">Rate breakdown</div>
      <div class="mt-2 divide-y divide-slate-100 text-sm">
        <div class="flex justify-between py-1.5"><span class="text-slate-600">Base linehaul</span><span class="tabular text-slate-800">$${r.base}</span></div>
        <div class="flex justify-between py-1.5"><span class="text-slate-600">Size uplift</span><span class="tabular text-slate-800">$${r.sizeAdd}</span></div>
        <div class="flex justify-between py-1.5"><span class="text-slate-600">Accessorials</span><span class="tabular text-slate-800">$${r.acc}</span></div>
        <div class="flex justify-between py-1.5"><span class="text-slate-600">Fuel (14%)</span><span class="tabular text-slate-800">$${r.fuel}</span></div>
        <div class="flex justify-between py-1.5"><span class="font-medium text-slate-700">Your cost</span><span class="tabular font-medium text-slate-900">$${r.cost}</span></div>
      </div>
      <div class="mt-3 rounded-lg bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
        <div class="flex items-center gap-1 text-[11px] font-medium text-sky-700"><i data-lucide="sparkles" class="h-3.5 w-3.5"></i> AI-suggested customer price</div>
        <div class="mt-1 flex items-end justify-between"><span class="text-3xl font-semibold text-slate-900">$${r.suggested}</span><span class="rounded-full bg-white px-2 py-0.5 text-xs font-medium text-emerald-600 ring-1 ring-emerald-200">${r.margin}% margin</span></div>
      </div>
      <button onclick="toast(&#39;Quote sent to customer&#39;)" class="mt-3 w-full rounded-lg bg-slate-900 py-2 text-xs font-medium text-white hover:bg-slate-800">Send quote to customer</button>

    </div>

}

function dvToggleOffline(){dv.offline=!dv.offline;if(!dv.offline&&dv.syncQueue.length){const n=dv.syncQueue.length;dv.syncQueue=[];toast("Back online — synced "+n+" update"+(n>1?"s":""));}else{toast(dv.offline?"Offline — updates will queue":"Back online");}renderDriverView();}
function dvStatus(label){if(dv.offline){dv.syncQueue.push({label,ts:dvNow()});toast(label+" — saved offline");}else{toast(label+" — sent to dispatch");}renderDriverView();}
function dvVoice(){dv.listening=true;renderDriverView();const finish=()=>{dv.listening=false;dvStatus("Arrived at terminal");};if(typeof setTimeout==="function")setTimeout(finish,1000);else finish();}
function dvScanType(t){dv.scanType=t;renderDriverView();}
function dvCapture(){const type=dv.scanType||"POD";const load=dv.load||"unassigned";dv.docs.unshift({type,load,ts:dvNow()});if(dv.offline)dv.syncQueue.push({label:type+" scan",ts:dvNow()});toast(type+" scanned — attached to "+load);renderDriverView();}
function dvQuick(t){if(!t)return;dv.chat.push({from:"me",t,ts:dvNow()});renderDriverView();}
function openDriverView(){dv.open=true;dv.screen="login";dv.tab="loads";dv.load=null;renderDriverView();}
function closeDriverView(){dv.open=false;const el=document.getElementById("driverview");el.className="hidden";el.innerHTML="";}
function dvScreen(s){dv.screen=s;renderDriverView();}
function dvTab(t){dv.tab=t;dv.load=null;renderDriverView();}
function dvOpen(id){dv.load=id;renderDriverView();}
function dvKey(d){if(dv.pin.length<4)dv.pin+=d;if(dv.pin.length>=4){dvDoLogin();return;}renderDriverView();}
function dvBack(){dv.pin=dv.pin.slice(0,-1);renderDriverView();}
function dvDoLogin(){dv.driverName=val("dv_driver")||(DRIVERS[0]&&DRIVERS[0].name)||null;dv.screen="app";dv.pin="";renderDriverView();}
function dvSignIn(){dvDoLogin();}
function dvDriverLoads(){if(!dv.driverName)return [];return LOADS.filter(function(l){return l.driver===dv.driverName&&((l.status!=="delivered"&&l.status!=="completed")||l.podStatus==="pending"||l.podStatus==="requested");});}
function dvGroupByDate(loads){var g={};loads.forEach(function(l){var d=(l.meta&&l.meta.dispatchDate)||"unscheduled";(g[d]=g[d]||[]).push(l);});return g;}
function dvDeliver(id){var l=LOADS.find(function(x){return x.id===id;});if(l){l.status="delivered";if(WZ.sb)wzUpsertLoad(l);}toast("Marked delivered — Penny will draft the invoice");dv.load=null;renderDriverView();if(typeof render==="function")render();}
window.dvDeliver=dvDeliver;
function dvArrive(id){var l=LOADS.find(function(x){return x.id===id;});if(l){l.meta=l.meta||{};l.meta.dates=l.meta.dates||{};l.meta.dates.arrived=new Date().toISOString().slice(0,16);if(WZ.sb)wzUpsertLoad(l);}toast("Arrival logged");renderDriverView();}
function dvDepart(id){var l=LOADS.find(function(x){return x.id===id;});if(l){l.meta=l.meta||{};l.meta.dates=l.meta.dates||{};l.meta.dates.departed=new Date().toISOString().slice(0,16);if(WZ.sb)wzUpsertLoad(l);}toast("Departure logged");renderDriverView();}
window.dvArrive=dvArrive;window.dvDepart=dvDepart;
window.openDriverView=openDriverView;window.closeDriverView=closeDriverView;window.dvScreen=dvScreen;window.dvTab=dvTab;window.dvOpen=dvOpen;window.dvKey=dvKey;window.dvBack=dvBack;window.dvSignIn=dvSignIn;window.dvToggleOffline=dvToggleOffline;window.dvStatus=dvStatus;window.dvVoice=dvVoice;window.dvScanType=dvScanType;window.dvCapture=dvCapture;window.dvQuick=dvQuick;
function dvLogin(){

    if(k==="")return `<div></div>`;
    if(k==="del")return `<button onclick="dvBack()" class="flex items-center justify-center rounded-xl bg-white/5 py-3 text-white active:bg-white/20"><i data-lucide="delete" class="h-5 w-5"></i></button>`;

    <div class="flex flex-col items-center text-center">
      <div class="flex h-14 w-14 items-center justify-center rounded-2xl text-xl font-bold" style="background:linear-gradient(135deg,#38bdf8,#6366f1)">W</div>
      <div class="mt-3 text-lg font-semibold">Wayz Driver</div>
      <div class="mt-1 text-xs text-slate-400">Enter your PIN to see your moves</div>
    </div>
    <div class="mt-5"><label class="mb-1 block text-xs text-slate-400">Sign in as</label><select id="dv_driver" class="w-full rounded-xl bg-white/10 px-4 py-3 text-sm text-white">${DRIVERS.length?DRIVERS.map(function(d){return `<option value="${d.name}" ${dv.driverName===d.name?"selected":""}>${d.name}</option>`;}).join(""):'<option value="">No drivers yet</option>'}</select></div>
    <div class="mt-3"><label class="mb-1 block text-xs text-slate-400">PIN</label><div class="flex gap-2">${dots}</div></div>
    <div class="mt-4 grid grid-cols-3 gap-2">${pad}</div>
    <button onclick="dvSignIn()" class="mt-4 w-full rounded-xl bg-sky-500 py-3 text-sm font-semibold text-white active:bg-sky-600">Sign in</button>
    <div class="mt-3 text-center text-[11px] text-slate-500">Any 4 digits · Español · ਪੰਜਾਬੀ · Русский</div>
  </div>`;
}
function dvLoadMini(l){return `<button onclick="dvOpen('${l.id}')" class="w-full rounded-2xl border border-slate-200 bg-white p-4 text-left active:bg-slate-50"><div class="flex items-center justify-between"><span class="text-sm font-semibold text-slate-900">${l.id}</span><span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-600">${l.routing||""}</span></div><div class="mt-1 font-mono text-xs text-slate-500">${l.container||""}</div><div class="mt-2 flex items-center gap-1.5 text-xs text-slate-500"><i data-lucide="map-pin" class="h-3.5 w-3.5"></i> ${l.terminal||"—"} → ${l.consignee||"—"}</div><div class="mt-2 flex items-center justify-between text-[11px]"><span class="text-slate-400">${l.pickupAppt?("Pickup "+fmtAppt(l.pickupAppt)):(l.deliveryAppt?("Deliver "+fmtAppt(l.deliveryAppt)):"No appt set")}</span><span class="font-medium text-sky-600">${(l.meta&&l.meta.dispatchDate)?fmtDay(l.meta.dispatchDate):""}</span></div></button>`;}
function dvLoadDetail(l){
  var pay=(typeof loadDriverPay==="function"?(loadDriverPay(l)||0):0);
  var legs=[{n:"Pull from "+(l.terminal||"terminal")},{n:(l.type==="EXP"?"Load at ":"Deliver to ")+(l.consignee||"customer")},{n:"Return empty"}];

  var paper=["TIR In","POD","TIR Out"].map(function(x){return `<button onclick="dvScanType('${x}');dvTab('scan')" class="flex flex-col items-center gap-1 rounded-xl border border-dashed border-slate-300 py-3 text-[11px] text-slate-500 active:bg-slate-50"><i data-lucide="camera" class="h-4 w-4"></i> ${x}</button>`;}).join("");
  var note=(l.holds&&l.holds.length)?("Holds to clear: "+l.holds.join(", ")):"Have booking # and TWIC ready at the terminal.";
  return `<div class="px-4 pt-3"><button onclick="dvTab('loads')" class="mb-2 flex items-center gap-1 text-xs text-slate-500"><i data-lucide="chevron-left" class="h-4 w-4"></i> My moves</button>${(l.podStatus==="pending"||l.podStatus==="requested")?'<div class="mb-3 flex items-center gap-2 rounded-xl bg-red-50 px-3 py-2 text-xs font-medium text-red-700"><i data-lucide="triangle-alert" class="h-4 w-4"></i> Ava needs the POD for this load \u2014 scan it below.</div>':''}
    <div class="mb-3 rounded-2xl p-4 text-white" style="background:linear-gradient(135deg,#0ea5e9,#6366f1)"><div class="flex items-center justify-between"><div><div class="text-xs opacity-80">This move pays</div><div class="text-3xl font-semibold" style="font-family:var(--font-display)">$${pay}</div></div><div class="text-right text-[11px] opacity-90">${(l.meta&&l.meta.dispatchDate)?fmtDay(l.meta.dispatchDate):"Not scheduled"}<br>${l.pickupAppt?("Pickup "+fmtAppt(l.pickupAppt)):""}</div></div></div>
    <div class="rounded-2xl border border-slate-200 bg-white p-4"><div class="flex items-center justify-between"><span class="text-base font-semibold text-slate-900">${l.id}</span><span class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-600">${l.routing||""}</span></div><div class="mt-1 font-mono text-xs text-slate-500">${l.container||""} · ${l.customer||""}</div><div class="mt-3 flex items-start gap-2 rounded-xl bg-amber-50 p-3 text-xs text-amber-800"><i data-lucide="info" class="mt-0.5 h-4 w-4 flex-shrink-0"></i><span>${note}</span></div><div class="mt-4">${legsHtml}</div></div>

  }

    const ded=[["Chassis rental",45],["Escrow",50]];
    const dedTot=ded.reduce((a,d)=>a+d[1],0);
    const net=gross-dedTot;
    const moveRows=DV_PAY.map(p=>`<div class="flex justify-between"><span class="text-slate-600">${p.id} · ${p.lane}</span><span class="tabular text-slate-800">$${p.amt}</span></div>`).join("");
    const dedRows=ded.map(d=>`<div class="flex justify-between"><span class="text-slate-500">− ${d[0]}</span><span class="tabular text-slate-500">$${d[1]}</span></div>`).join("");
    body=`<div class="px-4 pt-3"><div class="rounded-2xl p-4 text-white" style="background:linear-gradient(135deg,#0ea5e9,#6366f1)"><div class="text-xs opacity-80">This week · net</div><div class="text-3xl font-semibold" style="font-family:var(--font-display)">$${net.toLocaleString()}</div><div class="mt-1 text-xs opacity-80">${DV_PAY.length} moves · settles Friday</div></div><button onclick="toast(&#39;Instant pay requested&#39;)" class="mt-3 w-full rounded-xl border border-slate-200 bg-white py-2.5 text-xs font-semibold text-sky-600 active:bg-slate-50">Request instant pay</button><div class="mt-3 rounded-2xl border border-slate-200 bg-white p-4"><div class="text-xs font-semibold text-slate-800">Settlement statement</div><div class="mt-2 space-y-1.5 text-sm">${moveRows}<div class="flex justify-between border-t border-slate-100 pt-1.5"><span class="text-slate-500">Gross</span><span class="tabular font-medium text-slate-800">$${gross}</span></div>${dedRows}<div class="flex justify-between border-t border-slate-200 pt-1.5"><span class="font-semibold text-slate-800">Net pay</span><span class="tabular font-semibold text-emerald-600">$${net}</span></div></div><button onclick="toast(&#39;Statement downloaded&#39;)" class="mt-3 w-full rounded-xl bg-slate-900 py-2.5 text-xs font-semibold text-white">Download statement (PDF)</button></div></div>`;
  }
  else if(dv.tab==="chat"){
    const bubbles=dv.chat.map(m=>`<div class="flex ${m.from==='me'?'justify-end':'justify-start'}"><div class="max-w-[78%] rounded-2xl px-3 py-2 text-sm ${m.from==='me'?'bg-slate-900 text-white':'border border-slate-200 bg-white text-slate-700'}">${m.t}<div class="mt-0.5 text-[10px] ${m.from==='me'?'text-slate-300':'text-slate-400'}">${m.ts}</div></div></div>`).join("");

const TAB_BADGE={streetturns:2,watchlist:5};
function sectionTabs(sec){
  if(sec.items.length>8){
    return `<div class="wz-subnav"><select onchange="setActive(this.value)" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 outline-none focus:border-sky-400">`+sec.items.map(function(it){var b=TAB_BADGE[it.key];return `<option value="${it.key}" ${state.active===it.key?"selected":""}>${it.label}${(b!=null&&b>0)?(" ("+b+")"):""}</option>`;}).join("")+`</select></div>`;
  }
  return `<div class="wz-subnav">`+sec.items.map(it=>{
    const on=state.active===it.key;const b=TAB_BADGE[it.key];
    return `<button onclick="setActive('${it.key}')" class="wz-subtab ${on?'wz-subtab-on':''}">${it.label}${b!=null?`<span class="wz-badge ${b>0?'wz-badge-amber':'wz-badge-green'}">${b}</span>`:''}</button>`;
  }).join("")+`</div>`;
}

function daysToLFD(d){try{const t=new Date("2026-09-15");const x=new Date(d);return Math.round((x-t)/86400000);}catch(e){return null;}}

/* ================= PHASE 2 — DISPATCH OPTIMIZER ================= */
function opRev(l){return (l.charges&&l.charges.total)||0;}
function opMargin(l){return opRev(l)-loadDriverPay(l);}
function opScore(l){const d=daysToLFD(l.lfd);const lfdS=d==null?10:d<0?40:d<=1?35:d<=3?25:10;const mS=Math.max(0,Math.min(30,Math.round(opMargin(l)/2000*30)));const readyS=(l.holds&&l.holds.length)?0:20;const fitS=l.driver?5:10;return lfdS+mS+readyS+fitS;}
function opReasons(l){const r=[];const d=daysToLFD(l.lfd);if(d!=null&&d<0)r.push("LFD overdue");else if(d!=null&&d<=1)r.push("LFD today/tmrw");if(l.holds&&l.holds.length)r.push("holds: "+l.holds.join("+"));if(opMargin(l)>=500)r.push("$"+opMargin(l).toLocaleString()+" margin");if(!l.driver)r.push("unassigned");return r;}
function opAccept(kind,id){toast(kind+" · "+id);}
window.opAccept=opAccept;
function mOptimizer(){
  const active=LOADS.filter(l=>l.status!=="completed");
  const ranked=active.slice().sort((a,b)=>opScore(b)-opScore(a)).slice(0,6);
  const scoreRow=l=>{const sc=opScore(l);const rs=opReasons(l).map(x=>`<span class="rounded-full bg-slate-100 px-1.5 py-0.5 text-[10px] text-slate-600">${x}</span>`).join(" ");return `<div class="flex items-center gap-3 border-b border-slate-100 px-4 py-3 last:border-0"><div class="w-9 text-center"><div class="text-lg font-semibold ${sc>=70?'text-emerald-600':sc>=45?'text-amber-600':'text-slate-500'}" style="font-family:var(--font-display)">${sc}</div></div><div class="flex-1"><div class="text-sm font-medium text-slate-800">${l.id} · ${destCity(l)}</div><div class="mt-1 flex flex-wrap gap-1">${rs}</div></div><button onclick="opAccept('Dispatched','${l.id}')" class="rounded-md bg-slate-900 px-2.5 py-1.5 text-[11px] font-medium text-white">Dispatch</button></div>`;};
  const queue=`<div>${ranked.map(scoreRow).join("")}</div>`;
  const pre=active.filter(l=>{if(l.type!=="IMP")return false;const d=daysToLFD(l.lfd);return d!=null&&d<=1;});
  const preRows=pre.length?pre.map(l=>`<div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 last:border-0"><div><div class="text-sm font-medium text-slate-800">${l.container}</div><div class="text-[11px] text-slate-500">${l.terminal} · LFD ${l.lfd}</div></div><button onclick="opAccept('Pre-pull scheduled','${l.id}')" class="rounded-md bg-amber-500 px-2.5 py-1.5 text-[11px] font-medium text-white">Pre-pull today</button></div>`).join(""):'<div class="p-6 text-center text-xs text-slate-400">No pre-pulls needed right now.</div>';
  const byT={};active.forEach(l=>{(byT[l.terminal]=byT[l.terminal]||[]).push(l);});
  const pairs=[];Object.keys(byT).forEach(t=>{const arr=byT[t];for(let i=0;i+1<arr.length;i+=2){pairs.push([arr[i],arr[i+1],t]);}});
  const pairRows=pairs.length?pairs.slice(0,4).map(p=>`<div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 last:border-0"><div><div class="text-sm font-medium text-slate-800">${p[0].id} + ${p[1].id}</div><div class="text-[11px] text-slate-500">${p[2]} · pull + empty return, one trip</div></div><div class="text-right"><div class="text-[11px] font-medium text-emerald-600">save ~$50 gate</div><button onclick="opAccept('Paired','${p[0].id}+${p[1].id}')" class="mt-1 rounded-md border border-slate-200 px-2.5 py-1 text-[11px] text-slate-700 hover:bg-slate-50">Pair</button></div></div>`).join(""):'<div class="p-6 text-center text-xs text-slate-400">No dual-transaction pairs right now.</div>';
  const byC={};active.forEach(l=>{const c=destCity(l);if(c)(byC[c]=byC[c]||[]).push(l);});
  const chains=[];Object.keys(byC).forEach(c=>{const arr=byC[c];if(arr.length>=2)chains.push([arr[0],arr[1],c]);});
  const chainRows=chains.length?chains.slice(0,4).map(ch=>`<div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 last:border-0"><div><div class="text-sm font-medium text-slate-800">${ch[0].id} → ${ch[1].id}</div><div class="text-[11px] text-slate-500">both near ${ch[2]} · chain to skip a bobtail</div></div><button onclick="opAccept('Chained','${ch[0].id}+${ch[1].id}')" class="rounded-md border border-slate-200 px-2.5 py-1 text-[11px] text-slate-700 hover:bg-slate-50">Chain</button></div>`).join(""):'<div class="p-6 text-center text-xs text-slate-400">No chaining opportunities found.</div>';
  const k=kpis([["Priority moves",String(ranked.length)],["Pre-pull flags",String(pre.length),pre.length?"text-amber-600":"text-emerald-600"],["Dual-txn pairs",String(pairs.length)],["Est. miles saved","~"+(chains.length*18)]]);
  return `<div class="p-6"><div class="mb-3 flex items-center gap-2 text-sm text-slate-500"><i data-lucide="gauge" class="h-4 w-4"></i> Ranked by LFD urgency, margin &amp; readiness — with pre-pull, dual-transaction and bobtail suggestions.</div>${k}<div class="grid gap-4 xl:grid-cols-2"><div class="wz-card"><div class="wz-card-head">Move next — priority queue</div>${queue}</div><div class="wz-card"><div class="wz-card-head">Pre-pull today (LFD risk)</div>${preRows}</div><div class="wz-card"><div class="wz-card-head">Dual-transaction pairs</div>${pairRows}</div><div class="wz-card"><div class="wz-card-head">Bobtail minimizer — chains</div>${chainRows}</div></div></div>`;
}

  const rows=BK_TX.map((t,idx)=>{const on=!!r.matched[idx];const neg=String(t[3])[0]==="-";return `<tr class="hover:bg-slate-50"><td class="px-4 py-3 text-slate-500">${t[0]}</td><td class="px-4 py-3 font-medium text-slate-800">${t[1]}</td><td class="px-4 py-3 text-slate-500">${t[2]}</td><td class="px-4 py-3 text-right tabular ${neg?'text-slate-700':'text-emerald-600'}">${t[3]}</td><td class="px-4 py-3 text-center"><button onclick="reconMatch(${idx})" class="rounded-md px-2.5 py-1 text-[11px] font-medium ${on?'bg-emerald-500 text-white':'border border-slate-200 text-slate-600 hover:bg-slate-50'}">${on?'Cleared':'Match'}</button></td></tr>`;}).join("");

}

function accTotal(l){const c=l.charges||{};let t=(Number(c.base)||0)+(Number(c.fuel)||0)+(Number(c.demurrage)||0)+(Number(c.perdiem)||0);(c.items||[]).forEach(function(it){t+=Number(it.amount)||0;});return t;}
function accRow(label,amt,idOrNull,idx){return `<div class="flex items-center justify-between border-b border-slate-100 px-3 py-2 text-sm last:border-0"><span class="text-slate-600">${label}</span><span class="flex items-center gap-2"><span class="tabular text-slate-800">${money(Number(amt)||0)}</span>${idx!=null?`<button onclick="delAccessorial('${idOrNull}',${idx})" class="text-slate-300 hover:text-red-500"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>`:''}</span></div>`;}
function accSection(l){
  const c=l.charges||{};let rows="";
  rows+=accRow("Base drayage",c.base||0,null,null);
  if(c.fuel)rows+=accRow("Fuel surcharge",c.fuel,null,null);
  if(c.demurrage)rows+=accRow("Demurrage",c.demurrage,null,null);
  if(c.perdiem)rows+=accRow("Per diem",c.perdiem,null,null);
  (c.items||[]).forEach(function(it,idx){rows+=accRow(it.label||"Accessorial",it.amount,l.id,idx);});

function dedCsvUpload(){
  var fileEl=document.getElementById("ded_csv");var file=fileEl&&fileEl.files&&fileEl.files[0];
  if(!file){toast("Choose a CSV file first");return;}
  var reader=new FileReader();
  reader.onload=async function(){
    var text=String(reader.result||"");
    var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
    var toInsert=[],skipped=0;
    lines.forEach(function(line){
      var cols=line.split(",");
      var driver=String(cols[0]||"").trim().replace(/^"|"$/g,"");
      var amt=parseFloat(String(cols[1]||"").replace(/[^0-9.\-]/g,""));
      var label=(String(cols[2]||"").trim().replace(/^"|"$/g,""))||"Deduction";
      if(!driver||isNaN(amt)){skipped++;return;}
      toInsert.push({driver:driver,label:label,amount:amt});
    });
    if(!toInsert.length){toast("No valid rows found \u2014 check the format");return;}
    var s=apDedState();
    if(WZ.sb){try{await WZ.sb.from("deductions").insert(toInsert);}catch(e){toast("DB error: "+(e.message||e));}s.loaded=false;await apDedLoad();}
    else{s.list=(s.list||[]).concat(toInsert);render();}
    toast(toInsert.length+" deduction"+(toInsert.length!==1?"s":"")+" imported"+(skipped?(", "+skipped+" skipped"):""));
  };
  reader.readAsText(file);
}
window.dedCsvUpload=dedCsvUpload;

function loadIssues(l){
  var out=[];
  if((l.holds||[]).length)out.push("Holds: "+l.holds.join(", "));
  if(isExport(l)){var lr=loadLRD(l);if(lr){var mx=lfdMeta(lr);if((mx.txt||"").indexOf("overdue")>=0)out.push("LRD passed");else if((mx.txt||"").indexOf("today")>=0||(mx.txt||"").indexOf("1d")>=0)out.push("LRD imminent");}}
  else if(l.lfd){var m=lfdMeta(l.lfd);if((m.txt||"").indexOf("overdue")>=0)out.push("LFD overdue");else if((m.txt||"").indexOf("today")>=0||(m.txt||"").indexOf("1d")>=0)out.push("LFD imminent");}
  if(l.status==="available"&&!l.pickupAppt)out.push("No pickup appt");
  if(l.status==="available"&&!l.driver)out.push("Unassigned");
  return out;
}

    +'</tr>';}).join(""):'<tr><td colspan="4" class="px-4 py-12 text-center text-sm text-slate-400">No problem containers \u2014 all clear.</td></tr>';

function mChassisAudit(){
  const items=LOADS.map(function(l){

    try{if(chS){days=Math.max(1,Math.round((new Date(String(chE||chS).slice(0,10))-new Date(String(chS).slice(0,10)))/86400000));}}catch(e){}
    var charged=((l.charges&&l.charges.items)||[]).filter(function(x){return /chassis/i.test(x.label||"");}).reduce(function(a,x){return a+(Number(x.amount)||0);},0);
    var rate=(typeof rateGet==="function")?rateGet("chassis_day",l.customer):35;
    return {l:l,days:days,charged:charged,expected:days*rate};
  }).filter(function(x){return x.days>0||x.charged>0;});
  const rows=items.length?items.map(function(p){var l=p.l;var flag=p.charged===0&&p.expected>0?"missed":(Math.abs(p.charged-p.expected)>1?"variance":"ok");var fc=flag==="missed"?'bg-red-50 text-red-700':flag==="variance"?'bg-amber-50 text-amber-700':'bg-emerald-50 text-emerald-700';return `<tr class="cursor-pointer hover:bg-slate-50" onclick="openLoad('${l.id}')"><td class="px-4 py-3 font-medium text-sky-700">${l.id}</td><td class="px-4 py-3 font-mono text-xs text-slate-500">${(l.meta&&l.meta.chassis)||"\u2014"}</td><td class="px-4 py-3 tabular text-slate-600">${p.days}d</td><td class="px-4 py-3 tabular text-slate-600">${money(p.expected)}</td><td class="px-4 py-3 tabular text-slate-800">${money(p.charged)}</td><td class="px-4 py-3"><span class="rounded-full px-2 py-0.5 text-[10px] font-medium ${fc}">${flag}</span></td></tr>`;}).join(""):'<tr><td colspan="6" class="px-4 py-8 text-center text-sm text-slate-400">No chassis activity to audit.</td></tr>';

async function memLoad(t){var s=memState(t);if(!WZ.sb){s.notes=[];s.loaded=true;return;}try{var r=await WZ.sb.from(t).select("*").order("created_at",{ascending:true});if(!r.error)s.notes=r.data||[];}catch(e){s.notes=[];}s.loaded=true;render();}

async function memDel(t,id){if(WZ.sb&&id){try{await WZ.sb.from(t).delete().eq("id",id);}catch(e){}}var s=memState(t);s.notes=(s.notes||[]).filter(function(n){return n.id!==id;});render();}

window.wzConnect=wzConnect;
function wzInit(){
  let url="",key="";try{url=localStorage.getItem("wz_sb_url")||"";key=localStorage.getItem("wz_sb_key")||"";}catch(_){}
  if(url&&key){const go=()=>wzConnect(url,key,true);if(window.supabase)go();else{let n=0;const t=setInterval(()=>{if(window.supabase||n++>60){clearInterval(t);if(window.supabase)go();}},100);}}
}
function WZDB_CARD(){const on=WZ.connected;return `<div class="wz-card mb-4"><div class="wz-card-head flex items-center justify-between"><span>Database (Supabase)</span>${on?'<span class="inline-flex items-center gap-1 text-xs font-medium text-emerald-600"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Connected</span>':'<span class="text-xs font-medium text-amber-600">Not connected</span>'}</div><div class="p-4"><p class="mb-3 text-sm text-slate-500">Connect your Supabase project so new loads, drivers and invoices save and sync. Find these in Supabase → Project Settings → API. The anon key is safe to use here.</p><div class="space-y-2"><input id="wz_url" value="${WZ.url||''}" placeholder="https://xxxx.supabase.co" class="${wzInputCls}"/><input id="wz_key" value="${WZ.key||''}" placeholder="anon public key" class="${wzInputCls}"/></div><div class="mt-3"><button onclick="wzConnect(document.getElementById('wz_url').value,document.getElementById('wz_key').value)" class="wz-btn-brand rounded-lg px-3.5 py-2 text-sm font-semibold">Connect</button></div></div></div>`;}

/* ---- Add driver ---- */
function openAddDriver(){wzModal(`
  <div class="border-b border-slate-100 px-5 py-4"><div class="text-base font-semibold text-slate-900">Add driver</div></div>
  <div class="space-y-3 p-5">
    ${wzInput("wzd_name","Full name","e.g. Ricardo Alvarez")}
    ${wzInput("wzd_truck","Truck #","e.g. T-114")}
    ${wzInput("wzd_phone","Phone","(###) ###-####")}
    ${wzSelect("wzd_kind","Type",["Company driver","Owner-operator"])}
  </div>
  <div class="flex justify-end gap-2 border-t border-slate-100 px-5 py-4"><button onclick="wzClose()" class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Cancel</button><button onclick="submitDriver()" class="wz-btn-brand rounded-lg px-4 py-2 text-sm font-semibold">Add driver</button></div>`);}
async function submitDriver(){
  const name=val("wzd_name");if(!name){toast("Name is required");return;}
  const truck=val("wzd_truck"),phone=val("wzd_phone"),kind=val("wzd_kind")==="Owner-operator"?"owner_op":"company";
  const d={name,truck:truck||"—",status:"Available",loads:0,phone:phone||"—",hos:11,chassis:"",kind};
  DRIVERS.push(d);
  if(WZ.sb){try{const r=await WZ.sb.from("drivers").insert({name,truck,phone,kind,status:"available",hos:11}).select().single();if(r.error)throw r.error;if(r.data)d._id=r.data.id;}catch(e){toast("Added locally · DB error: "+(e.message||e));}}
  wzClose();toast("Driver added: "+name);setActive("drivers");
}
window.openAddDriver=openAddDriver;window.submitDriver=submitDriver;

/* ---- Create load ---- */
function nextLoadId(){let mx=24800;LOADS.forEach(l=>{const m=/WZ-(\d+)/.exec(l.id||"");if(m)mx=Math.max(mx,+m[1]);});return "WZ-"+(mx+1);}
function openCreateLoad(){wzModal(`
  <div class="border-b border-slate-100 px-5 py-4"><div class="text-base font-semibold text-slate-900">Create load</div></div>
  <div class="grid grid-cols-2 gap-3 p-5">
    ${wzInput("wzl_container","Container #","MSCU1234567")}
    ${wzInput("wzl_ssl","SSL","MSC")}
    <div class="col-span-2">${wzInput("wzl_mbl","MBL #","MEDU12345678")}</div>
    ${wzSelect("wzl_terminal","Terminal (port)",["APM","PNCT","Port Liberty Bayonne","GCT NY","Maher","Red Hook"])}
    ${wzSelect("wzl_routing","Routing",["Live","Prepull-Live","Drop and Hook","Prepull drop","1 Way","Export"])}
    <div><label class="mb-1 block text-xs font-medium text-slate-500">Type</label><select id="wzl_type" onchange="wzTypeToggle()" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:border-sky-400"><option value="IMP">Import (IMP)</option><option value="EXP">Export (EXP)</option></select></div>
    ${wzSelect("wzl_size","Size",["20'","40'","40HC","45'"])}
    <div class="col-span-2">${wzInput("wzl_customer","Customer","e.g. Atlantic Wholesale")}</div>
    <div class="col-span-2">${wzInput("wzl_consignee","Deliver to (Name — City, ST)","Atlantic DC — Edison, NJ")}</div>
    <div class="col-span-2">${wzInput("wzl_base","Customer rate ($)","e.g. 850","number")}</div>
    ${wzInput("wzl_pappt","Pickup date / time","","datetime-local")}
    ${wzInput("wzl_dappt","Delivery date / time","","datetime-local")}
    <div class="col-span-2" id="imp_dates">${wzInput("wzl_lfd","Last free day (LFD)","","date")}</div>
    <div class="col-span-2 hidden" id="exp_dates"><div class="grid grid-cols-2 gap-3">${wzInput("wzl_erd","Earliest receiving (ERD)","","date")}${wzInput("wzl_lrd","Last receiving (LRD / cutoff)","","date")}<div class="col-span-2">${wzInput("wzl_booking","Booking #","e.g. BKNG1234567")}</div></div></div>
  </div>
  <div class="flex justify-end gap-2 border-t border-slate-100 px-5 py-4"><button onclick="wzClose()" class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50">Cancel</button><button onclick="submitLoad()" class="wz-btn-brand rounded-lg px-4 py-2 text-sm font-semibold">Create load</button></div>`);}
function wzTypeToggle(){var t=(val("wzl_type")||"IMP").toUpperCase();var imp=document.getElementById("imp_dates"),exp=document.getElementById("exp_dates");if(imp)imp.classList.toggle("hidden",t==="EXP");if(exp)exp.classList.toggle("hidden",t!=="EXP");}
window.wzTypeToggle=wzTypeToggle;
async function submitLoad(){
  const container=val("wzl_container");if(!container){toast("Container # is required");return;}
  const id=nextLoadId();const base=Number(val("wzl_base"))||0;
  const type=(val("wzl_type")||"IMP").toUpperCase();
  const meta={dates:{}};
  if(type==="EXP"){meta.dates.erd=val("wzl_erd")||null;meta.dates.lrd=val("wzl_lrd")||null;meta.booking=val("wzl_booking")||null;}
  const rec={id,container,mbl:val("wzl_mbl"),ssl:val("wzl_ssl"),terminal:val("wzl_terminal"),routing:val("wzl_routing"),type,size:val("wzl_size"),customer_name:val("wzl_customer"),consignee:val("wzl_consignee"),lfd:(type==="EXP"?null:(val("wzl_lfd")||null)),pickup_appt:val("wzl_pappt")||null,delivery_appt:val("wzl_dappt")||null,appt:val("wzl_pappt")||null,status:"available",charges:{base:base},holds:[],meta};
  LOADS.unshift(wzMapLoad(rec));
  if(WZ.sb){try{const r=await WZ.sb.from("loads").insert(rec);if(r.error)throw r.error;}catch(e){toast("Created locally · DB error: "+(e.message||e));}}
  wzClose();toast("Load created: "+id);wzConfetti();setActive("dispatch");
}
window.openCreateLoad=openCreateLoad;window.submitLoad=submitLoad;


render();
wzInit();
</script>
</body>
</html>
